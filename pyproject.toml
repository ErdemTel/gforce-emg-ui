[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gforce-emg-ui"
dynamic = ["version"]
description = "Low-latency 8-channel EMG UI for the OYMotion gForceUltra armband"
requires-python = ">=3.10"
dependencies = [
    "sensor-sdk>=1.3.3",
    "PyQt5>=5.15",
    "pyqtgraph>=0.13",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gforce-emg-ui = "gforce_emg_ui.__main__:main"
gforce-emg-ui-bench = "gforce_emg_ui.bench:main"

[tool.setuptools.dynamic]
version = { attr = "gforce_emg_ui.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
